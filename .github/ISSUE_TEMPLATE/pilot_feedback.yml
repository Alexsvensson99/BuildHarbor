name: 0.1 pilot feedback
description: Record one session from the capped three-developer pilot.
title: "[Pilot 0.1] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form only for an agreed 0.1 pilot slot. Replace personal paths and real UUIDs with placeholders. One issue may cover one developer's full pilot history if each session is dated.
  - type: input
    id: participant
    attributes:
      label: Anonymous pilot identifier
      placeholder: P1, P2, or P3
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS …; Python …; Xcode 27.0 (27A266a); project type …
    validations:
      required: true
  - type: input
    id: setup_minutes
    attributes:
      label: Minutes to first successful doctor and plan
      placeholder: "12"
    validations:
      required: true
  - type: input
    id: run_minutes
    attributes:
      label: Minutes to first successful guarded run
      placeholder: "18"
    validations:
      required: true
  - type: textarea
    id: exceptions
    attributes:
      label: Project exceptions or configuration changes
      description: Write “None” when no exception was needed.
    validations:
      required: true
  - type: textarea
    id: blocks
    attributes:
      label: False blocks or unsafe allows
      description: For each case, include the diagnostic and the evidence used to classify it. Write “None” if there were none.
    validations:
      required: true
  - type: textarea
    id: repeat
    attributes:
      label: Repeat usage
      description: List the dates and outcomes of later guarded runs.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Remaining blocker or friction
      description: State what would prevent continued use. Write “None” when nothing remains.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private paths, real volume UUIDs, signing material, and secrets.
          required: true
